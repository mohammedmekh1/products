D.rows.forEach(r=>{const tr=el('tr');r.forEach(c=>tr.append(el('td',String(c))));$('rows').append(tr)});
D.q.forEach(q=>{const f=el('fieldset');f.append(el('legend',q.t));if(q.why)f.append(el('p',q.why,'muted'));q.o.forEach((o,i)=>{const l=el('label');const r=document.createElement('input');r.type='radio';r.name=q.id;r.value=o;r.id=q.id+i;l.append(r,el('span',o));f.append(l)});$('qs').append(f)});
let db=null;(async()=>{try{db=await claude.use('db');if(db){const s=await db.doc('reportA002/answers').get();if(s.exists){const a=s.data();Object.entries(a).forEach(([k,v])=>{document.querySelectorAll('input[name="'+k+'"]').forEach(i=>{if(i.value===v)i.checked=true})})}}}catch(e){}})();
$('save').addEventListener('click',async()=>{const a={};D.q.forEach(q=>{const c=document.querySelector('input[name="'+q.id+'"]:checked');if(c)a[q.id]=c.value});
 if(!db){$('saved').textContent='الحفظ غير متاح في هذا العرض. انسخ اختياراتك في المحادثة.';return}
 try{await db.doc('reportA002/answers').set(a);$('saved').textContent='تم حفظ '+Object.keys(a).length+' إجابة. أخبر Claude أنك أجبت.'}catch(e){$('saved').textContent='تعذر الحفظ.'}});
</script>
