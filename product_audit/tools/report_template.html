<title>تقرير الدفعة __BATCH__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: one reading column; summary tiles, findings, questions with options, review table */
:root{--bg:#f4f4f1;--card:#fff;--fg:#1c2327;--muted:#5d6b72;--accent:#a3361f;--on-accent:#fff;--line:#dcdcd6;--ok:#1b7f4a;--warn:#955f00;--chip:#eceae3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1d2226;--fg:#e8ecee;--muted:#97a4ab;--accent:#ff8a6e;--on-accent:#2a0d05;--line:#2e363b;--ok:#62d492;--warn:#e6b955;--chip:#262d32;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1d2226;--fg:#e8ecee;--muted:#97a4ab;--accent:#ff8a6e;--on-accent:#2a0d05;--line:#2e363b;--ok:#62d492;--warn:#e6b955;--chip:#262d32;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:Tahoma,system-ui,sans-serif;direction:rtl;line-height:1.8;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:820px;margin:0 auto;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:10px;min-width:0}
h1{font-size:22px;margin:0}h2{font-size:17px;margin:0}p,li{margin:0}ul{margin:0;padding-inline-start:20px;display:grid;gap:4px}
.muted{color:var(--muted)}.tiles{display:flex;flex-wrap:wrap;gap:10px}.tile{background:var(--chip);border-radius:10px;padding:10px 14px;min-width:120px}.tile b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
fieldset{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px;min-width:0}legend{font-weight:bold;padding:0 6px}
label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
button{font:inherit;background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:10px 16px;cursor:pointer;justify-self:start}button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.tw{overflow-x:auto;max-height:520px;overflow-y:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right;vertical-align:top}th{position:sticky;top:0;background:var(--card)}
#saved{color:var(--ok)}
</style>
<main>
<div class="card"><h1>تقرير الدفعة __BATCH__</h1><p class="muted" id="sub"></p><div class="tiles" id="tiles"></div></div>
<div class="card"><h2>ما حدث</h2><ul id="did"></ul></div>
<div class="card"><h2>مشاكل وُجدت</h2><ul id="found"></ul></div>
<div class="card"><h2>أسئلة تحتاج قراراً منك</h2><div id="qs" style="display:grid;gap:12px"></div><button id="save" type="button">حفظ الإجابات</button><p id="saved"></p></div>
<div class="card"><h2>المنتجات المجهزة: العنوان القديم والجديد</h2><div class="tw"><table><thead><tr><th>#</th><th>القديم</th><th>الجديد</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</main>
<script type="application/json" id="d">{"rows":__ROWS__,"q":__Q__,"s":__STATS__}</script>
<script>
const D=JSON.parse(document.getElementById('d').textContent),$=id=>document.getElementById(id);
const el=(t,txt,c)=>{const e=document.createElement(t);if(txt!==undefined)e.textContent=txt;if(c)e.className=c;return e};
$('sub').textContent=D.s.sub;
D.s.tiles.forEach(([k,v])=>{const t=el('div','','tile');t.append(el('b',v),el('span',k,'muted'));$('tiles').append(t)});
D.s.did.forEach(x=>$('did').append(el('li',x)));D.s.found.forEach(x=>$('found').append(el('li',x)));
D.rows.forEach(r=>{const tr=el('tr');r.forEach(c=>tr.append(el('td',String(c))));$('rows').append(tr)});
D.q.forEach(q=>{const f=el('fieldset');f.append(el('legend',q.t));if(q.why)f.append(el('p',q.why,'muted'));q.o.forEach((o,i)=>{const l=el('label');const r=document.createElement('input');r.type='radio';r.name=q.id;r.value=o;r.id=q.id+i;l.append(r,el('span',o));f.append(l)});$('qs').append(f)});
let db=null;(async()=>{try{db=await claude.use('db');if(db){const s=await db.doc('report__BATCH__/answers').get();if(s.exists){const a=s.data();Object.entries(a).forEach(([k,v])=>{document.querySelectorAll('input[name="'+k+'"]').forEach(i=>{if(i.value===v)i.checked=true})})}}}catch(e){}})();
$('save').addEventListener('click',async()=>{const a={};D.q.forEach(q=>{const c=document.querySelector('input[name="'+q.id+'"]:checked');if(c)a[q.id]=c.value});
 if(!db){$('saved').textContent='الحفظ غير متاح في هذا العرض. انسخ اختياراتك في المحادثة.';return}
 try{await db.doc('report__BATCH__/answers').set(a);$('saved').textContent='تم حفظ '+Object.keys(a).length+' إجابة. أخبر Claude أنك أجبت.'}catch(e){$('saved').textContent='تعذر الحفظ.'}});
</script>
